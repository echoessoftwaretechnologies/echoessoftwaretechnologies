<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="echoes_favicon.png">
</head>
<body>
    <div class="browser-container">
        <!-- Window Title Bar -->
        <div class="browser-title-bar">
            <div class="window-controls">
                <button class="control-btn close-btn" title="Close"></button>
                <button class="control-btn minimize-btn" title="Minimize"></button>
                <button class="control-btn maximize-btn" title="Maximize"></button>
            </div>
            <div class="app-title">Echoes Browser</div>
        </div>
        
        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tab active-tab">
                <span class="tab-title">New Tab</span>
                <button class="tab-close-btn">×</button>
            </div>
            <button class="new-tab-btn" title="New Tab">+</button>
        </div>
        
        <!-- Navigation Bar -->
        <div class="navigation-bar">
            <div class="nav-buttons">
                <button class="nav-btn back-btn" id="backBtn" title="Back">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                    </svg>
                </button>
                <button class="nav-btn forward-btn" id="forwardBtn" title="Forward">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
                    </svg>
                </button>
                <button class="nav-btn refresh-btn" id="refreshBtn" title="Refresh">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                    </svg>
                </button>
                <button class="nav-btn home-btn" id="homeBtn" title="Home">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                </button>
            </div>
            
            <div class="address-bar-container">
                <svg class="address-bar-icon" width="20" height="20" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <input type="text" id="addressBar" class="address-bar" placeholder="Enter a URL or search term" autocomplete="off" maxlength="2048">
                <button class="search-btn" id="searchBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                    </svg>
                </button>
            </div>
            
            <div class="extra-controls">
                <button class="nav-btn bookmarks-btn" title="Bookmarks">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M17,3H7A2,2 0 0,0 5,5V21L12,18L19,21V5A2,2 0 0,0 17,3M17,18L12,15.82L7,18V5H17V18Z" />
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="browser-content">
            <iframe id="webFrame" name="webFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-popups-to-escape-sandbox" src="about:blank" title="Web Content" referrerpolicy="no-referrer"></iframe>
        </div>
        
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="page-info">Ready</div>
            <div class="security-indicator secure">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M12,7C13.4,7 14.8,8.6 14.8,10.5V11.5C15.4,11.5 16,12.1 16,13V16C16,16.97 15.4,17.5 14.5,17.5H9.5C8.6,17.5 8,16.97 8,16V13C8,12.1 8.6,11.5 9.2,11.5V10.5C9.2,8.6 10.6,7 12,7M12,8.2C11.2,8.2 10.5,8.7 10.5,10.5V11.5H13.5V10.5C13.5,8.7 12.8,8.2 12,8.2Z" />
                </svg>
                Secure Connection
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
